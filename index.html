    <style>
        @keyframes xpFloat {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-50px);
            }
        }

        @keyframes xpBarFill {
            0% {
                transform: scaleX(0);
            }
            100% {
                transform: scaleX(1);
            }
        }

        @keyframes confetti {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .xp-float {
            animation: xpFloat 1.5s ease-out forwards;
            position: absolute;
            font-weight: bold;
            font-size: 1.5rem;
            color: #10b981;
            pointer-events: none;
            z-index: 1000;
        }

        .xp-bar-fill {
            animation: xpBarFill 0.5s ease-out;
            transform-origin: left;
        }

        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            animation: confetti 3s ease-out forwards;
            z-index: 9999;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .level-up-modal {
            animation: pulse 0.5s ease-in-out;
        }
    </style>

            { id: 'chapter-4-master', name: 'Chapter 4 Master', desc: '90%+ accuracy on Chapter 4 (min 10 questions)', emoji: '📕', category: 'chapter' },
            { id: 'chapter-5-master', name: 'Chapter 5 Master', desc: '90%+ accuracy on Chapter 5 (min 10 questions)', emoji: '📔', category: 'chapter' },
            { id: 'chapter-6-master', name: 'Chapter 6 Master', desc: '90%+ accuracy on Chapter 6 (min 10 questions)', emoji: '📒', category: 'chapter' },

            // Skill-Based Achievements
            { id: 'perfectionist', name: 'Perfectionist', desc: 'Get 10 questions correct in a row', emoji: '✨', category: 'skill' },
            { id: 'speed-demon', name: 'Speed Demon', desc: 'Answer 5 questions in under 2 minutes (all correct)', emoji: '⚡', category: 'skill' },
            { id: 'k3-killer', name: 'K3 Killer', desc: 'Get 20 K3 questions correct', emoji: '🎯', category: 'skill' },
            { id: 'principle-expert', name: 'Principle Expert', desc: 'Get all 7 Testing Principles questions correct', emoji: '🧠', category: 'skill' },
            { id: 'full-stack', name: 'Full Stack Tester', desc: 'Answer at least 10 questions from each chapter', emoji: '🌟', category: 'skill' },

            // Fun Achievements
            { id: 'early-bird', name: 'Early Bird', desc: 'Study before 8 AM', emoji: '🌅', category: 'fun' },
            { id: 'night-owl', name: 'Night Owl', desc: 'Study after 10 PM', emoji: '🦉', category: 'fun' },
            { id: 'weekend-warrior', name: 'Weekend Warrior', desc: 'Study on Saturday or Sunday', emoji: '🎮', category: 'fun' },
            { id: 'century-club', name: 'Century Club', desc: 'Earn 1000 total XP', emoji: '💯', category: 'fun' }
        ];

        function QuizApp() {
            const [currentScreen, setCurrentScreen] = useState('home'); // 'home', 'quiz', or 'achievements'
            const [selectedMode, setSelectedMode] = useState(null); // 'all' or chapter number
            const [quizQuestions, setQuizQuestions] = useState([]);
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [answeredQuestions, setAnsweredQuestions] = useState({});
            const [showExplanation, setShowExplanation] = useState(false);
            const [chapterStats, setChapterStats] = useState({});

            // RPG Progression State
            const [xp, setXp] = useState(0);
            const [level, setLevel] = useState(1);
            const [showLevelUp, setShowLevelUp] = useState(false);
            const [xpGain, setXpGain] = useState(null);

            // Streak State
            const [streak, setStreak] = useState(0);
            const [lastLoginDate, setLastLoginDate] = useState(null);
            const [streakHistory, setStreakHistory] = useState([]);
            const [showMilestone, setShowMilestone] = useState(false);
            const [milestoneData, setMilestoneData] = useState({ days: 0, message: '', xp: 0 });

            // Achievement State
            const [achievements, setAchievements] = useState({});
            const [achievementProgress, setAchievementProgress] = useState({});
            const [unlockedToast, setUnlockedToast] = useState(null);
            const [sessionStartTime, setSessionStartTime] = useState(null);
            const [consecutiveCorrect, setConsecutiveCorrect] = useState(0);

            // Load chapter stats from localStorage on mount
            useEffect(() => {
                const saved = localStorage.getItem('ctfl-chapter-stats');
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        setChapterStats(data);
                    } catch (e) {
                        console.error('Error loading chapter stats:', e);
                    }
                }
            }, []);

            // Load XP and level from localStorage
            useEffect(() => {
                const savedProgress = localStorage.getItem('ctfl-rpg-progress');
                if (savedProgress) {
                    try {
                        const data = JSON.parse(savedProgress);
                        setXp(data.xp || 0);
                        setLevel(data.level || 1);
                    } catch (e) {
                        console.error('Error loading RPG progress:', e);
                    }
                }
            }, []);

            // Load and check streak on mount
            useEffect(() => {
                const savedStreak = localStorage.getItem('ctfl-streak-data');
                if (savedStreak) {
                    try {
                        const data = JSON.parse(savedStreak);
                        setStreakHistory(data.history || []);
                        checkDailyLogin(data.lastLogin, data.streak, data.history || []);
                    } catch (e) {
                        console.error('Error loading streak data:', e);
                        checkDailyLogin(null, 0, []);
                    }
                } else {
                    checkDailyLogin(null, 0, []);
                }
            }, []);

            // Load achievements from localStorage
            useEffect(() => {
                const savedAchievements = localStorage.getItem('ctfl-achievements');
                const savedProgress = localStorage.getItem('ctfl-achievement-progress');

                if (savedAchievements) {
                    try {
                        setAchievements(JSON.parse(savedAchievements));
                    } catch (e) {
                        console.error('Error loading achievements:', e);
                    }
                }

                if (savedProgress) {
                    try {
                        setAchievementProgress(JSON.parse(savedProgress));
                    } catch (e) {
                        console.error('Error loading achievement progress:', e);
                    }
                }
            }, []);

            // Check time-based achievements on mount
            useEffect(() => {
                const hour = new Date().getHours();
                const day = new Date().getDay();

                // Early Bird (before 8 AM)
                if (hour < 8) {
                    unlockAchievement('early-bird');
                }

                // Night Owl (after 10 PM)
                if (hour >= 22) {
                    unlockAchievement('night-owl');
                }

                // Weekend Warrior (Saturday or Sunday)
                if (day === 0 || day === 6) {
                    unlockAchievement('weekend-warrior');
                }
            }, []);

            // Save chapter stats to localStorage
            const saveChapterStats = (stats) => {
                localStorage.setItem('ctfl-chapter-stats', JSON.stringify(stats));
                setChapterStats(stats);
            };

            // Save XP and level to localStorage
            const saveRPGProgress = (newXp, newLevel) => {
                const data = { xp: newXp, level: newLevel };
                localStorage.setItem('ctfl-rpg-progress', JSON.stringify(data));
            };

            // Save streak data to localStorage
            const saveStreakData = (currentStreak, loginDate, history) => {
                const data = {
                    streak: currentStreak,
                    lastLogin: loginDate,
                    history: history
                };
                localStorage.setItem('ctfl-streak-data', JSON.stringify(data));
            };

            // Save achievements to localStorage
            const saveAchievements = (newAchievements) => {
                localStorage.setItem('ctfl-achievements', JSON.stringify(newAchievements));
                setAchievements(newAchievements);
            };

            // Save achievement progress
            const saveAchievementProgress = (newProgress) => {
                localStorage.setItem('ctfl-achievement-progress', JSON.stringify(newProgress));
                setAchievementProgress(newProgress);
            };

            // Unlock an achievement
            const unlockAchievement = (achievementId) => {
                if (achievements[achievementId]) return; // Already unlocked

                const achievement = achievementList.find(a => a.id === achievementId);
                if (!achievement) return;

                const newAchievements = { ...achievements, [achievementId]: true };
                saveAchievements(newAchievements);

                // Show toast notification
                setUnlockedToast(achievement);
                setTimeout(() => setUnlockedToast(null), 4000);
            };

            // Get total questions answered
            const getTotalQuestionsAnswered = () => {
                return Object.values(chapterStats).reduce((sum, stat) => sum + (stat.total || 0), 0);
            };

            // Check all achievements
            const checkAchievements = () => {
                const totalAnswered = getTotalQuestionsAnswered();

                // Beginner achievements
                if (totalAnswered >= 1) unlockAchievement('first-steps');
                if (totalAnswered >= 10) unlockAchievement('getting-started');
                if (totalAnswered >= 50) unlockAchievement('committed');
                if (totalAnswered >= 100) unlockAchievement('dedicated');
                if (streak >= 7) unlockAchievement('week-warrior');

                // Chapter Master achievements
                for (let i = 1; i <= 6; i++) {
                    const chapterStat = chapterStats[i];
                    if (chapterStat && chapterStat.total >= 10) {
                        const accuracy = (chapterStat.correct / chapterStat.total) * 100;
                        if (accuracy >= 90) {
                            unlockAchievement(`chapter-${i}-master`);
                        }
                    }
                }

                // Perfectionist (10 in a row)
                if (consecutiveCorrect >= 10) {
                    unlockAchievement('perfectionist');
                }

                // K3 Killer (20 K3 correct)
                const k3Count = achievementProgress.k3Correct || 0;
                if (k3Count >= 20) {
                    unlockAchievement('k3-killer');
                }

                // Full Stack Tester (10+ from each chapter)
                let hasFullStack = true;
                for (let i = 1; i <= 6; i++) {
                    const chapterStat = chapterStats[i];
                    if (!chapterStat || chapterStat.total < 10) {
                        hasFullStack = false;
                        break;
                    }
                }
                if (hasFullStack) {
                    unlockAchievement('full-stack');
                }

                // Century Club (1000 XP)
                if (xp >= 1000 || (achievementProgress.totalXP || 0) >= 1000) {
                    unlockAchievement('century-club');
                }
            };

            // Get today's date string (YYYY-MM-DD)
            const getTodayString = () => {
                const today = new Date();
                return today.toISOString().split('T')[0];
            };

            // Get date difference in days
            const getDaysDifference = (date1Str, date2Str) => {
                const date1 = new Date(date1Str);
                const date2 = new Date(date2Str);
                const diffTime = Math.abs(date2 - date1);
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                return diffDays;
            };

            // Check daily login and update streak
            const checkDailyLogin = (lastLogin, currentStreak, history) => {
                const today = getTodayString();

                if (!lastLogin) {
                    // First time user
                    const newHistory = [...history, today];
                    setStreak(1);
                    setLastLoginDate(today);
                    setStreakHistory(newHistory);
                    saveStreakData(1, today, newHistory);
                    return;
                }

                if (lastLogin === today) {
                    // Already logged in today
                    setStreak(currentStreak);
                    setLastLoginDate(lastLogin);
                    return;
                }

                const daysDiff = getDaysDifference(lastLogin, today);

                if (daysDiff === 1) {
                    // Consecutive day - increment streak
                    const newStreak = currentStreak + 1;
                    const newHistory = [...history, today];
                    setStreak(newStreak);
                    setLastLoginDate(today);
                    setStreakHistory(newHistory);
                    saveStreakData(newStreak, today, newHistory);

                    // Check for milestones
                    checkStreakMilestone(newStreak);
                } else {
                    // Missed days - reset streak
                    const newHistory = [...history, today];
                    setStreak(1);
                    setLastLoginDate(today);
                    setStreakHistory(newHistory);
                    saveStreakData(1, today, newHistory);
                }
            };

            // Check if streak hit a milestone
            const checkStreakMilestone = (currentStreak) => {
                const milestones = [
                    { days: 7, message: 'One Week Strong!', xp: 500 },
                    { days: 14, message: 'Two Weeks Strong!', xp: 1000 },
                    { days: 30, message: 'One Month Champion!', xp: 3000 }
                ];

                const milestone = milestones.find(m => m.days === currentStreak);
                if (milestone) {
                    setMilestoneData(milestone);
                    setShowMilestone(true);
                    awardXP(milestone.xp);
                    createConfetti();
                }
            };

            // Get XP for K-level
            const getXPForKLevel = (kLevel) => {
                const xpMap = {
                    'K1': 10,
                    'K2': 25,
                    'K3': 50
                };
                return xpMap[kLevel] || 0;
            };

            // Get XP needed for next level
            const getXPForNextLevel = (currentLevel) => {
                return currentLevel * 100;
            };

            // Get level title
            const getLevelTitle = (currentLevel) => {
                if (currentLevel <= 5) return 'Junior Tester';
                if (currentLevel <= 10) return 'Test Engineer';
                if (currentLevel <= 15) return 'Senior Tester';
                if (currentLevel <= 20) return 'Test Lead';
                if (currentLevel <= 25) return 'Test Manager';
                return 'Test Architect';
            };

            // Award XP and check for level up
            const awardXP = (earnedXP) => {
                let newXp = xp + earnedXP;
                let newLevel = level;
                let leveledUp = false;

                // Check for level ups
                while (newLevel < 30 && newXp >= getXPForNextLevel(newLevel)) {
                    newXp -= getXPForNextLevel(newLevel);
                    newLevel += 1;
                    leveledUp = true;
                }

                setXp(newXp);
                setLevel(newLevel);
                saveRPGProgress(newXp, newLevel);

                // Show XP gain animation
                setXpGain(earnedXP);
                setTimeout(() => setXpGain(null), 1500);

                // Show level up modal with confetti
                if (leveledUp) {
                    setShowLevelUp(true);
                    createConfetti();
                }
            };

            // Create confetti effect
            const createConfetti = () => {
                const colors = ['#f87171', '#60a5fa', '#34d399', '#fbbf24', '#a78bfa', '#fb923c'];
                const confettiCount = 50;

                for (let i = 0; i < confettiCount; i++) {
                    setTimeout(() => {
                        const confetti = document.createElement('div');
                        confetti.className = 'confetti-piece';
                        confetti.style.left = Math.random() * 100 + '%';
                        confetti.style.top = '-10px';
                        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                        confetti.style.animationDelay = Math.random() * 0.5 + 's';
                        document.body.appendChild(confetti);

                        setTimeout(() => confetti.remove(), 3000);
                    }, i * 30);
                }
            };

            // Start a quiz with selected mode
            const startQuiz = (mode) => {
                let questions = [];

                if (mode === 'all') {
                    // Random 40 questions from all chapters
                    const shuffled = [...questionBank].sort(() => Math.random() - 0.5);
                    questions = shuffled.slice(0, 40);
                } else {
                    // All questions from specific chapter
                    questions = questionBank.filter(q => q.chapter === mode);
                }

                setSelectedMode(mode);
                setQuizQuestions(questions);
                setCurrentQuestionIndex(0);
                setAnsweredQuestions({});
                setSelectedAnswer(null);
                setShowExplanation(false);
                setCurrentScreen('quiz');
            };

            // Calculate stats for a chapter
            const getChapterStats = (chapterNum) => {
                const stats = chapterStats[chapterNum];
                if (!stats || stats.total === 0) {
                    return { accuracy: 0, total: 0, correct: 0 };
                }
                return {
                    accuracy: Math.round((stats.correct / stats.total) * 100),
                    total: stats.total,
                    correct: stats.correct
                };
            };

            // Get color based on accuracy
            const getAccuracyColor = (accuracy) => {
                if (accuracy >= 85) return 'green';
                if (accuracy >= 70) return 'yellow';
                return 'red';
            };

            const currentQuestion = currentScreen === 'quiz' && quizQuestions.length > 0
                ? quizQuestions[currentQuestionIndex]
                : null;
            const totalQuestions = quizQuestions.length;
            const isQuestionAnswered = currentQuestion ? answeredQuestions[currentQuestion.id] !== undefined : false;

            // Calculate current score
            const score = Object.values(answeredQuestions).filter(a => a.correct).length;

            const handleAnswerClick = (answerIndex) => {
                if (isQuestionAnswered) return;

                setSelectedAnswer(answerIndex);
                setShowExplanation(true);

                const isCorrect = answerIndex === currentQuestion.correct;
                const questionChapter = currentQuestion.chapter;

                setAnsweredQuestions(prev => ({
                    ...prev,
                    [currentQuestion.id]: {
                        selected: answerIndex,
                        correct: isCorrect,
                        chapter: questionChapter
                    }
                }));

                // Update chapter stats
                const newStats = { ...chapterStats };
                if (!newStats[questionChapter]) {
                    newStats[questionChapter] = { correct: 0, total: 0 };
                }
                newStats[questionChapter].total += 1;
                if (isCorrect) {
                    newStats[questionChapter].correct += 1;
                }
                saveChapterStats(newStats);

                // Award XP for correct answers
                if (isCorrect) {
                    const earnedXP = getXPForKLevel(currentQuestion.kLevel);
                    awardXP(earnedXP);
                }

                // Track achievement progress
                const newProgress = { ...achievementProgress };

                // Track consecutive correct
                if (isCorrect) {
                    setConsecutiveCorrect(prev => prev + 1);

                    // Track K3 correct count
                    if (currentQuestion.kLevel === 'K3') {
                        newProgress.k3Correct = (newProgress.k3Correct || 0) + 1;
                    }

                    // Track total XP for Century Club
                    newProgress.totalXP = (newProgress.totalXP || 0) + getXPForKLevel(currentQuestion.kLevel);
                } else {
                    setConsecutiveCorrect(0);
                }

                // Track Speed Demon (5 questions in under 2 minutes)
                if (!sessionStartTime) {
                    setSessionStartTime(Date.now());
                }

                const answeredCount = Object.keys(answeredQuestions).length + 1;
                if (answeredCount === 5 && isCorrect) {
                    const timeElapsed = (Date.now() - sessionStartTime) / 1000 / 60; // minutes
                    const allCorrect = Object.values({...answeredQuestions, [currentQuestion.id]: {correct: isCorrect}})
                        .filter(a => a.correct).length === 5;

                    if (timeElapsed < 2 && allCorrect) {
                        unlockAchievement('speed-demon');
                    }
                }

                saveAchievementProgress(newProgress);

                // Check achievements
                setTimeout(() => checkAchievements(), 500);
            };

            const handleNextQuestion = () => {
                if (currentQuestionIndex < totalQuestions - 1) {
                    setCurrentQuestionIndex(prev => prev + 1);
                    setSelectedAnswer(null);
                    setShowExplanation(false);
                }
            };

            const handlePreviousQuestion = () => {
                if (currentQuestionIndex > 0) {
                    setCurrentQuestionIndex(prev => prev - 1);
                    setSelectedAnswer(null);
                    setShowExplanation(false);
                }
            };

            const handleBackToMenu = () => {
                if (window.confirm('Return to menu? Your progress will be saved in statistics.')) {
                    setCurrentScreen('home');
                    setSelectedMode(null);
                    setQuizQuestions([]);
                    setCurrentQuestionIndex(0);
                    setAnsweredQuestions({});
                    setSelectedAnswer(null);
                    setShowExplanation(false);
                }
            };

            const getAnswerButtonClass = (index) => {
                const baseClass = "w-full text-left p-4 rounded-lg border-2 transition-all duration-200 ";

                if (!isQuestionAnswered) {
                    return baseClass + "border-gray-300 hover:border-blue-500 hover:bg-blue-50 bg-white";
                }

                const previousAnswer = answeredQuestions[currentQuestion.id];

                if (index === currentQuestion.correct) {
                    return baseClass + "border-green-500 bg-green-50";
                }

                if (index === previousAnswer.selected && !previousAnswer.correct) {
                    return baseClass + "border-red-500 bg-red-50";
                }

                return baseClass + "border-gray-300 bg-gray-100 opacity-60";
            };

            const getOptionLabel = (index) => {
                return ['A', 'B', 'C', 'D'][index];
            };

            // Level Up Modal Component
            const LevelUpModal = () => (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="level-up-modal bg-white rounded-lg shadow-2xl p-8 max-w-md w-full text-center">
                        <div className="text-6xl mb-4">🎉</div>
                        <h2 className="text-4xl font-bold text-gray-800 mb-2">LEVEL UP!</h2>
                        <p className="text-2xl text-blue-600 font-bold mb-2">Level {level}</p>
                        <p className="text-xl text-gray-700 mb-6">{getLevelTitle(level)}</p>
                        <button
                            onClick={() => setShowLevelUp(false)}
                            className="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold transition-colors"
                        >
                            Continue
                        </button>
                    </div>
                </div>
            );

            // Streak Milestone Modal Component
            const MilestoneModal = () => (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="level-up-modal bg-white rounded-lg shadow-2xl p-8 max-w-md w-full text-center">
                        <div className="text-6xl mb-4">🔥</div>
                        <h2 className="text-4xl font-bold text-gray-800 mb-2">STREAK MILESTONE!</h2>
                        <p className="text-2xl text-orange-600 font-bold mb-2">{milestoneData.days} Days</p>
                        <p className="text-xl text-gray-700 mb-4">{milestoneData.message}</p>
                        <div className="bg-green-100 border-2 border-green-300 rounded-lg p-4 mb-6">
                            <p className="text-lg font-bold text-green-800">Bonus Reward!</p>
                            <p className="text-2xl font-bold text-green-600">+{milestoneData.xp} XP</p>
                        </div>
                        <button
                            onClick={() => setShowMilestone(false)}
                            className="px-8 py-3 bg-orange-600 hover:bg-orange-700 text-white rounded-lg font-semibold transition-colors"
                        >
                            Amazing!
                        </button>
                    </div>
                </div>
            );

            // Toast Notification Component
            const AchievementToast = ({ achievement }) => {
                if (!achievement) return null;

                return (
                    <div className="fixed top-4 right-4 z-50 bg-gradient-to-r from-yellow-400 to-yellow-500 text-gray-900 rounded-lg shadow-2xl p-6 max-w-sm animate-bounce">
                        <div className="flex items-center gap-4">
                            <div className="text-5xl">{achievement.emoji}</div>
                            <div>
                                <p className="text-sm font-semibold text-yellow-900">Achievement Unlocked!</p>
                                <h3 className="text-xl font-bold">{achievement.name}</h3>
                                <p className="text-sm text-gray-800">{achievement.desc}</p>
                            </div>
                        </div>
                    </div>
                );
            };

            // Streak Counter Component
            const StreakCounter = () => {
                if (streak === 0) {
                    return (
                        <div className="bg-gray-100 rounded-lg px-4 py-2 text-sm">
                            <span className="text-gray-600">Start your streak today!</span>
                        </div>
                    );
                }

                return (
                    <div className="bg-gradient-to-r from-orange-500 to-red-500 rounded-lg px-4 py-2 text-white font-bold shadow-md">
                        <span className="text-2xl mr-1">🔥</span>
                        <span>{streak} day{streak !== 1 ? 's' : ''}</span>
                    </div>
                );
            };

            // Badge Counter Component
            const BadgeCounter = () => {
                const unlockedCount = Object.keys(achievements).length;
                const totalCount = achievementList.length;

                return (
                    <button
                        onClick={() => setCurrentScreen('achievements')}
                        className="bg-gradient-to-r from-purple-500 to-pink-500 rounded-lg px-4 py-2 text-white font-bold shadow-md hover:from-purple-600 hover:to-pink-600 transition-all"
                    >
                        <span className="text-2xl mr-1">🏅</span>
                        <span>{unlockedCount}/{totalCount}</span>
                    </button>
                );
            };

            // 30-Day Calendar Component
            const StreakCalendar = () => {
                const getLast30Days = () => {
                    const days = [];
                    const today = new Date();

                    for (let i = 29; i >= 0; i--) {
                        const date = new Date(today);
                        date.setDate(date.getDate() - i);
                        const dateStr = date.toISOString().split('T')[0];
                        days.push({
                            date: dateStr,
                            day: date.getDate(),
                            active: streakHistory.includes(dateStr)
                        });
                    }
                    return days;
                };

                const days = getLast30Days();

                return (
                    <div className="bg-white rounded-lg shadow-lg p-6">
                        <h3 className="text-lg font-semibold mb-4 text-gray-800 flex items-center gap-2">
                            <span className="text-2xl">📅</span>
                            Last 30 Days Activity
                        </h3>
                        <div className="grid grid-cols-10 gap-2">
                            {days.map((day, index) => (
                                <div
                                    key={index}
                                    className={`aspect-square rounded flex items-center justify-center text-xs font-semibold ${
                                        day.active
                                            ? 'bg-green-500 text-white'
                                            : 'bg-gray-200 text-gray-400'
                                    }`}
                                    title={day.date}
                                >
                                    {day.day}
                                </div>
                            ))}
                        </div>
                        <div className="mt-4 flex gap-4 text-sm">
                            <div className="flex items-center gap-2">
                                <div className="w-4 h-4 bg-green-500 rounded"></div>
                                <span className="text-gray-700">Studied</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <div className="w-4 h-4 bg-gray-200 rounded"></div>
                                <span className="text-gray-700">Missed</span>
                            </div>
                        </div>
                    </div>
                );
            };

            // XP Bar Component
            const XPBar = () => {
                const xpNeeded = getXPForNextLevel(level);
                const xpProgress = (xp / xpNeeded) * 100;

                return (
                    <div className="bg-gray-100 rounded-lg p-4 mb-4">
                        <div className="flex justify-between items-center mb-2">
                            <div>
                                <span className="text-lg font-bold text-gray-800">Level {level}</span>
                                <span className="text-sm text-gray-600 ml-2">{getLevelTitle(level)}</span>
                            </div>
                            <div className="text-sm text-gray-600">
                                {xp} / {xpNeeded} XP
                            </div>
                        </div>
                        <div className="w-full bg-gray-300 rounded-full h-4 overflow-hidden">
                            <div
                                className="xp-bar-fill h-full bg-gradient-to-r from-blue-500 to-purple-600 rounded-full transition-all duration-300"
                                style={{ width: `${Math.min(xpProgress, 100)}%` }}
                            />
                        </div>
                    </div>
                );
            };

            // Achievements Screen Component
            if (currentScreen === 'achievements') {
                const getProgress = (achievementId) => {
                    const totalAnswered = getTotalQuestionsAnswered();

                    switch(achievementId) {
                        case 'getting-started': return `${Math.min(totalAnswered, 10)}/10`;
                        case 'committed': return `${Math.min(totalAnswered, 50)}/50`;
                        case 'dedicated': return `${Math.min(totalAnswered, 100)}/100`;
                        case 'week-warrior': return `${Math.min(streak, 7)}/7 days`;
                        case 'perfectionist': return `${Math.min(consecutiveCorrect, 10)}/10`;
                        case 'k3-killer': return `${Math.min(achievementProgress.k3Correct || 0, 20)}/20`;
                        case 'century-club': {
                            const totalXP = achievementProgress.totalXP || xp;
                            return `${Math.min(totalXP, 1000)}/1000 XP`;
                        }
                        default:
                            for (let i = 1; i <= 6; i++) {
                                if (achievementId === `chapter-${i}-master`) {
                                    const stat = chapterStats[i];
                                    if (!stat) return '0/10 questions';
                                    const accuracy = stat.total > 0 ? Math.round((stat.correct / stat.total) * 100) : 0;
                                    return `${accuracy}% (${stat.total}/10 min)`;
                                }
                            }
                            return null;
                    }
                };

                const groupedAchievements = {
                    beginner: achievementList.filter(a => a.category === 'beginner'),
                    chapter: achievementList.filter(a => a.category === 'chapter'),
                    skill: achievementList.filter(a => a.category === 'skill'),
                    fun: achievementList.filter(a => a.category === 'fun')
                };

                const categoryNames = {
                    beginner: 'Beginner',
                    chapter: 'Chapter Master',
                    skill: 'Skill-Based',
                    fun: 'Fun'
                };

                return (
                    <div className="min-h-screen py-8 px-4">
                        <div className="max-w-6xl mx-auto">
                            <AchievementToast achievement={unlockedToast} />

                            {/* Header */}
                            <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h1 className="text-3xl font-bold text-gray-800 mb-2">Achievements</h1>
                                        <p className="text-gray-600">
                                            {Object.keys(achievements).length} / {achievementList.length} Unlocked
                                        </p>
                                    </div>
                                    <button
                                        onClick={() => setCurrentScreen('home')}
                                        className="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold transition-colors"
                                    >
                                        ← Back to Home
                                    </button>
                                </div>
                            </div>

                            {/* Achievement Categories */}
                            {Object.entries(groupedAchievements).map(([category, achList]) => (
                                <div key={category} className="bg-white rounded-lg shadow-lg p-6 mb-6">
                                    <h2 className="text-2xl font-bold text-gray-800 mb-6">{categoryNames[category]}</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {achList.map(achievement => {
                                            const isUnlocked = achievements[achievement.id];
                                            const progress = getProgress(achievement.id);

                                            return (
                                                <div
                                                    key={achievement.id}
                                                    className={`p-6 rounded-lg border-2 transition-all ${
                                                        isUnlocked
                                                            ? 'border-yellow-400 bg-gradient-to-br from-yellow-50 to-yellow-100'
                                                            : 'border-gray-300 bg-gray-100'
                                                    }`}
                                                >
                                                    <div className="flex items-start gap-4">
                                                        <div className={`text-5xl ${isUnlocked ? '' : 'grayscale opacity-40'}`}>
                                                            {achievement.emoji}
                                                        </div>
                                                        <div className="flex-1">
                                                            <h3 className={`text-lg font-bold mb-1 ${
                                                                isUnlocked ? 'text-gray-900' : 'text-gray-500'
                                                            }`}>
                                                                {achievement.name}
                                                            </h3>
                                                            <p className={`text-sm mb-2 ${
                                                                isUnlocked ? 'text-gray-700' : 'text-gray-400'
                                                            }`}>
                                                                {achievement.desc}
                                                            </p>
                                                            {!isUnlocked && progress && (
                                                                <div className="mt-2">
                                                                    <p className="text-xs font-semibold text-blue-600">
                                                                        Progress: {progress}
                                                                    </p>
                                                                </div>
                                                            )}
                                                            {isUnlocked && (
                                                                <div className="mt-2">
                                                                    <span className="inline-block px-3 py-1 bg-yellow-500 text-white text-xs font-bold rounded-full">
                                                                        UNLOCKED
                                                                    </span>
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            // Home Screen Component
            if (currentScreen === 'home') {
                return (
                    <div className="min-h-screen py-8 px-4">
                        <div className="max-w-4xl mx-auto">
                            {/* Toast */}
                            <AchievementToast achievement={unlockedToast} />

                            {/* Modals */}
                            {showMilestone && <MilestoneModal />}

                            {/* Header */}
                            <div className="bg-white rounded-lg shadow-lg p-8 mb-8">
                                <div className="flex justify-between items-start mb-4">
                                    <div className="text-center flex-1">
                                        <h1 className="text-4xl font-bold text-gray-800 mb-3">
                                            CTFL Quiz App
                                        </h1>
                                        <p className="text-gray-600 text-lg mb-6">
                                            Certified Tester Foundation Level Exam Preparation
                                        </p>
                                    </div>
                                    <div className="ml-4 flex gap-3">
                                        <BadgeCounter />
                                        <StreakCounter />
                                    </div>
                                </div>
                                <XPBar />
                            </div>

                            {/* Chapter Selection */}
                            <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                                <h2 className="text-2xl font-semibold text-gray-800 mb-6">
                                    Select Quiz Mode
                                </h2>

                                <div className="space-y-4">
                                    {/* All Topics Button */}
                                    <button
                                        onClick={() => startQuiz('all')}
                                        className="w-full p-6 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white rounded-lg shadow-md transition-all duration-200 transform hover:scale-[1.02]"
                                    >
                                        <div className="flex justify-between items-center">
                                            <div className="text-left">
                                                <h3 className="text-xl font-bold mb-1">All Topics</h3>
                                                <p className="text-blue-100 text-sm">Random 40 questions from all chapters</p>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-2xl font-bold">40</div>
                                                <div className="text-sm text-blue-100">Questions</div>
                                            </div>
                                        </div>
                                    </button>

                                    {/* Chapter Buttons */}
                                    {Object.entries(chapterInfo).map(([chapterNum, info]) => {
                                        const stats = getChapterStats(parseInt(chapterNum));
                                        const color = getAccuracyColor(stats.accuracy);

                                        const colorClasses = {
                                            green: 'from-green-500 to-green-600 hover:from-green-600 hover:to-green-700',
                                            yellow: 'from-yellow-500 to-yellow-600 hover:from-yellow-600 hover:to-yellow-700',
                                            red: 'from-red-500 to-red-600 hover:from-red-600 hover:to-red-700'
                                        };

                                        const bgClass = stats.total > 0
                                            ? `bg-gradient-to-r ${colorClasses[color]}`
                                            : 'bg-gradient-to-r from-gray-500 to-gray-600 hover:from-gray-600 hover:to-gray-700';

                                        return (
                                            <button
                                                key={chapterNum}
                                                onClick={() => startQuiz(parseInt(chapterNum))}
                                                className={`w-full p-6 ${bgClass} text-white rounded-lg shadow-md transition-all duration-200 transform hover:scale-[1.02]`}
                                            >
                                                <div className="flex justify-between items-start">
                                                    <div className="text-left flex-1">
                                                        <h3 className="text-lg font-bold mb-1">
                                                            Chapter {chapterNum}: {info.name}
                                                        </h3>
                                                        <p className="text-sm opacity-90">
                                                            {info.questionCount} questions
                                                        </p>
                                                    </div>
                                                    <div className="text-right ml-4">
                                                        {stats.total > 0 ? (
                                                            <>
                                                                <div className="text-3xl font-bold">
                                                                    {stats.accuracy}%
                                                                </div>
                                                                <div className="text-xs opacity-90">
                                                                    {stats.correct}/{stats.total} correct
                                                                </div>
                                                            </>
                                                        ) : (
                                                            <div className="text-sm opacity-90">
                                                                Not attempted
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Streak Calendar */}
                            <div className="mb-6">
                                <StreakCalendar />
                            </div>

                            {/* Legend */}
                            <div className="bg-white rounded-lg shadow-lg p-6">
                                <h3 className="text-lg font-semibold mb-4 text-gray-800">Performance Legend</h3>
                                <div className="flex flex-wrap gap-4">
                                    <div className="flex items-center gap-2">
                                        <div className="w-6 h-6 bg-green-500 rounded"></div>
                                        <span className="text-sm text-gray-700">85%+ (Excellent)</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <div className="w-6 h-6 bg-yellow-500 rounded"></div>
                                        <span className="text-sm text-gray-700">70-84% (Good)</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <div className="w-6 h-6 bg-red-500 rounded"></div>
                                        <span className="text-sm text-gray-700">&lt;70% (Needs Improvement)</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <div className="w-6 h-6 bg-gray-500 rounded"></div>
                                        <span className="text-sm text-gray-700">Not Attempted</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // Quiz Screen Component
            return (
                <div className="min-h-screen py-8 px-4">
                    <div className="max-w-3xl mx-auto">
                        {/* Toast */}
                        <AchievementToast achievement={unlockedToast} />

                        {/* Modals */}
                        {showLevelUp && <LevelUpModal />}
                        {showMilestone && <MilestoneModal />}

                        {/* XP Gain Animation */}
                        {xpGain && (
                            <div className="xp-float" style={{ left: '50%', top: '20%', transform: 'translateX(-50%)' }}>
                                +{xpGain} XP
                            </div>
                        )}

                        {/* Header */}
                        <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <div className="flex justify-between items-center mb-4">
                                <div className="flex-1">
                                    <h1 className="text-2xl md:text-3xl font-bold text-gray-800">
                                        CTFL Quiz
                                    </h1>
                                    <p className="text-sm text-gray-600 mt-1">
                                        {selectedMode === 'all'
                                            ? 'All Topics - Mixed Questions'
                                            : `Chapter ${selectedMode}: ${chapterInfo[selectedMode].name}`}
                                    </p>
                                </div>
                                <div className="flex gap-3 items-center">
                                    <StreakCounter />
                                    <button
                                        onClick={handleBackToMenu}
                                        className="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors"
                                    >
                                        ← Back to Menu
                                    </button>
                                </div>
                            </div>

                            {/* XP Bar */}
                            <XPBar />

                            {/* Progress Bar */}
                            <div className="mb-4">
                                <div className="flex justify-between text-sm text-gray-600 mb-2">
                                    <span>Question {currentQuestionIndex + 1} of {totalQuestions}</span>
                                    <span className="font-semibold">Score: {score}/{totalQuestions}</span>
                                </div>
                                <div className="w-full bg-gray-200 rounded-full h-2">
                                    <div
                                        className="bg-blue-600 h-2 rounded-full transition-all duration-300"
                                        style={{ width: `${((currentQuestionIndex + 1) / totalQuestions) * 100}%` }}
                                    />
                                </div>
                            </div>

                            {/* Question Info */}
                            <div className="flex gap-4 text-sm">
                                <span className="px-3 py-1 bg-blue-100 text-blue-800 rounded-full">
                                    Chapter {currentQuestion.chapter}
                                </span>
                                <span className="px-3 py-1 bg-purple-100 text-purple-800 rounded-full">
                                    {currentQuestion.kLevel}
                                </span>
                                <span className="px-3 py-1 bg-green-100 text-green-800 rounded-full font-semibold">
                                    +{getXPForKLevel(currentQuestion.kLevel)} XP
                                </span>
                            </div>
                        </div>

                        {/* Question Card */}
                        <div className="bg-white rounded-lg shadow-lg p-6 mb-6 relative">
                            <h2 className="text-xl font-semibold text-gray-800 mb-6">
                                {currentQuestion.question}
                            </h2>

                            {/* Answer Options */}
                            <div className="space-y-3 mb-6">
                                {currentQuestion.options.map((option, index) => (
                                    <button
                                        key={index}
                                        onClick={() => handleAnswerClick(index)}
                                        disabled={isQuestionAnswered}
                                        className={getAnswerButtonClass(index)}
                                    >
                                        <span className="font-semibold mr-2">{getOptionLabel(index)}.</span>
                                        {option}
                                    </button>
                                ))}
                            </div>

                            {/* Feedback and Explanation */}
                            {isQuestionAnswered && (
                                <div className={`p-4 rounded-lg ${
                                    answeredQuestions[currentQuestion.id].correct
                                        ? 'bg-green-50 border-2 border-green-200'
                                        : 'bg-red-50 border-2 border-red-200'
                                }`}>
                                    <p className={`font-semibold mb-2 ${
                                        answeredQuestions[currentQuestion.id].correct
                                            ? 'text-green-800'
                                            : 'text-red-800'
                                    }`}>
                                        {answeredQuestions[currentQuestion.id].correct
                                            ? '✓ Correct!'
                                            : '✗ Incorrect'}
                                    </p>
                                    <p className="text-gray-700">
                                        <span className="font-semibold">Explanation: </span>
                                        {currentQuestion.explanation}
                                    </p>
                                </div>
                            )}
                        </div>

                        {/* Navigation Buttons */}
                        <div className="flex gap-4">
                            <button
                                onClick={handlePreviousQuestion}
                                disabled={currentQuestionIndex === 0}
                                className={`flex-1 py-3 rounded-lg font-semibold transition-colors ${
                                    currentQuestionIndex === 0
                                        ? 'bg-gray-200 text-gray-400 cursor-not-allowed'
                                        : 'bg-gray-300 hover:bg-gray-400 text-gray-800'
                                }`}
                            >
                                ← Previous
                            </button>

                            {currentQuestionIndex < totalQuestions - 1 ? (
                                <button
                                    onClick={handleNextQuestion}
                                    className="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold transition-colors"
                                >
                                    Next Question →
                                </button>
                            ) : (
                                <div className="flex-1 py-3 bg-green-600 text-white rounded-lg font-semibold text-center">
                                    Quiz Complete! Final Score: {score}/{totalQuestions}
                                </div>
                            )}
                        </div>

                        {/* Question Overview */}
                        <div className="mt-6 bg-white rounded-lg shadow-lg p-6">
                            <h3 className="text-lg font-semibold mb-4">Question Overview</h3>
                            <div className="grid grid-cols-10 gap-2">
                                {quizQuestions.map((q, index) => {
                                    const isAnswered = answeredQuestions[q.id];
                                    const isCurrent = index === currentQuestionIndex;

                                    return (
                                        <button
                                            key={q.id}
                                            onClick={() => {
                                                setCurrentQuestionIndex(index);
                                                setSelectedAnswer(null);
                                                setShowExplanation(false);
                                            }}
                                            className={`aspect-square rounded flex items-center justify-center text-sm font-semibold transition-all ${
                                                isCurrent
                                                    ? 'ring-2 ring-blue-500 ring-offset-2'
                                                    : ''
                                            } ${
                                                !isAnswered
                                                    ? 'bg-gray-200 hover:bg-gray-300'
                                                    : isAnswered.correct
                                                    ? 'bg-green-500 text-white'
                                                    : 'bg-red-500 text-white'
                                            }`}
                                        >
                                            {index + 1}
                                        </button>
                                    );
                                })}
                            </div>
                            <div className="mt-4 flex gap-4 text-sm">
                                <div className="flex items-center gap-2">
                                    <div className="w-4 h-4 bg-green-500 rounded"></div>
                                    <span>Correct</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="w-4 h-4 bg-red-500 rounded"></div>
                                    <span>Incorrect</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="w-4 h-4 bg-gray-200 rounded"></div>
                                    <span>Unanswered</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<QuizApp />);
    </script>
</body>
</html>
